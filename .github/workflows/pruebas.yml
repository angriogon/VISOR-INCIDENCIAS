name: Pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxis de los scripts
        run: for f in *.js extension/*.js tests/*.js; do node --check "$f"; done
      - name: Pruebas
        run: node tests/pruebas.js
      - name: Prueba de arranque en navegador
        run: |
          npm i --no-save --no-audit --no-fund playwright-core@1.47.2
          node tests/arranque.mjs
